<!DOCTYPE html>
<html lang="zh-CN" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArmGuard - Material Design 3 ARM Linux 运维控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      图标字体：Material Symbols 已自托管在 /fonts/ 下（见 styles.scss 的 @font-face），
      不再依赖 fonts.googleapis.com —— 运维面板在离线/受限网络下也必须能显示图标。
      旧 Material Icons 保留为后备（部分老图标名只在旧字体里）。
    -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography m3-app-body">
    <ag-root></ag-root>
  </body>
</html>
