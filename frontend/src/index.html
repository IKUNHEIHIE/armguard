<!DOCTYPE html>
<html lang="zh-CN" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArmGuard - Material Design 3 ARM Linux 运维控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Material Symbols 是 Material Design 3 对应的图标集，也是旧 Material Icons 的超集。
      旧字体没有 deployed_code / database / folder_zip 等较新的图标名，会导致图标显示为空白或文字。
      保留 Material Icons 作为后备：若 Symbols 字体加载失败，常见图标仍能正常显示。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography m3-app-body">
    <ag-root></ag-root>
  </body>
</html>
